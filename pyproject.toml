[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-button"
version = "0.2.1"
description = "Push-to-Talk auf der ThinkPad-Copilot-Taste: Whisper large-v3-turbo streamt Text an die Cursor-Position"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
# "runtime" = der komplette ML-Stack, der beim .deb-Build in den
# pro-User-venv installiert wird. DIE EINZIGE QUELLE der pinnten
# Versionen ist packaging/runtime-requirements.txt (aus dem
# getesteten venv gefroren, torch/torchaudio kommen separat vom
# PyTorch-CPU-Index). Diese Liste ist nur uebersicht/hand. Manuell
# installieren:  pip install -r packaging/runtime-requirements.txt
runtime = [
    "faster-whisper>=1.2,<2",
    "transformers>=5.20",
    "onnxruntime>=1.31",
    "onnx-asr>=0.12",
    "numpy>=2",
    "ctranslate2>=4.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
]

[project.scripts]
stt-button = "stt_button.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: Tests die ein echtes Modell oder Mikrofon brauchen",
]

[tool.coverage.run]
source = ["stt_button"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
