# STT-Button Konfiguration
# Kopiere in ~/.config/stt-button/config.toml und passe an.

# --- Ausloeser ---------------------------------------------------------
# Das Device, auf dem die Copilot-Taste erscheint.
# Auf ThinkPads mit keyd: "keyd virtual keyboard" (Taste -> F24)
input_device_name = "keyd virtual keyboard"
# Die Linux-Keycodes, die Push-to-Talk ausloesen.
key_codes = ["KEY_F24"]

# --- Audio -------------------------------------------------------------
# PipeWire-Quellenname (aus: pactl list short sources) oder "auto".
# Die Standardquelle "deepfilter_source" (Rauschunterdrueckung) ist auf
# diesem ThinkPad stumm, wenn das Digital Microphone stumm geschaltet ist.
# Daher hier explizit die SOF-Quelle. "auto" nimmt deepfilter_source.
audio_source = "alsa_input.pci-0000_00_1f.3-platform-sof_sdw.HiFi__hw_sofsoundwire_10__source"

# --- ASR ---------------------------------------------------------------
backend = "parakeet"           # "parakeet" (NVIDIA TDT, schnell) oder "whisper"
model = "nvidia/parakeet-tdt-0.6b-v3"   # bei backend=whisper: "large-v3-turbo"
language = "auto"             # Parakeet erkennt DE/EN automatisch
compute_type = "float32"     # parakeet: float32 (CPU); whisper: int8
cpu_threads = 8

# --- Ausgabe -----------------------------------------------------------
typer = "dotool"               # "dotool" (GNOME/Wayland), "wtype", "clipboard"
xkb_layout = "de"               # Tastaturlayout fuer dotool
xkb_variant = "nodeadkeys"      # ohne tote Tasten (fuer Akzente)
typedelay_ms = 20              # Tipp-Tempo; bei Modifier-Haengern erhoehen (z.B. 30)
typehold_ms = 15               # Tasten-Haltezeit
capslock_autocorrect = false   # App darf CapsLock NIE ungefragt togglen (nur warnen); true = vor dem Tippen auf den Zielzustand zwingen
capslock_led_inverted = true    # LED-Semantik dieses Systems (belegt): true = LED aus heisst CapsLock aktiv; Ziel bei autocorrect = LED an
append_space = true            # Leerzeichen nach dem Diktat
max_revision_chars = 60
final_paste = false           # true = finales Delta beim Abschluss per Zwischenablage statt tippen (Durchsatz)
paste_key = "ctrl+v"          # Einfuege-Chord; "ctrl+shift+v" fuer Terminals
paste_binary = "wl-copy"      # Binary fuer den Copy-Schritt (wl-clipboard)

# --- Streaming ---------------------------------------------------------
streaming_mode = "whole_buffer"
min_audio_s = 3.0              # erst transkribieren, wenn 3s Audio da sind
asr_interval_s = 1.0           # Re-Transkription alle X Sekunden Audio
max_record_s = 300.0
commit_agreements = 2          # Praefix-Bestaetigungen vor dem Commit
sample_rate = 16000

# --- Latenz (STUFE 1) ------------------------------------------------------
# finalize_mode: "full" = Finalisierung transkribiert den ganzen Puffer neu
# (bisheriges Verhalten); "cached" = unveraendertes Audio seit dem letzten
# erfolgreichen Live-Tick wird ohne Engine-Call uebernommen (spart bei kurzem
# Diktat einen kompletten Inferenz-Durchlauf; nur bei deterministischen
# Engines wie Parakeet sinnvoll).
finalize_mode = "full"
# audio_dump_mode: "sync" = WAV-Debug-Dump im Finalizer (bisher),
# "async" = Dump im eigenen Thread (Datei-I/O nicht auf dem kritischen Pfad),
# "off" = kein Dump. Ziel bleibt /tmp/stt_last.wav.
audio_dump_mode = "sync"
# latency_trace: true loggt Debug-Zeiten an den Messpunkten Release -> Ausgabe
# (stop entered / source stopped / dump / finalize start / finalize end / paste).
latency_trace = false

# --- Live-Vorschau-Modi (STUFE 2/3) ----------------------------------------
# live_typing_mode: "committed" (Default) tippt nur den gesicherten
# Praefix-Zuwachs - der unstabile Partial wird nie zurueckgetippt, das
# finale Suffix kommt beim Loslassen als EIN Paste (null Backspaces).
# "full" (Opt-in) tippt unstabile Partials live und korrigiert sie per
# Backspace (bisheriges Verhalten, lebendige Vorschau).
live_typing_mode = "committed"
# live_asr_until_s: Live-Ticks nach dieser Pufferlaenge (Sekunden)
# einstellen - der Whole-Buffer-Ansatz wird pro Tick teurer. feed()
# sammelt weiter, finalize() transkribiert den kompletten Puffer.
# Default 15.0: mit int8-Engine (RTF ~0,05) kostet ein 15-s-Vollpuffer-
# Tick ~0,75s < asr_interval_s (1,0s) - Live-Vorschau bis 15s tragfaehig.
# 0.0 = Live-Ticks immer aktiv (bisheriges Verhalten, Opt-in).
live_asr_until_s = 15.0

# Fertig-Signal (Betreiber 31.10.): leiser Ton nach ERFOLGREICHER
# Finalisierung = 'Text liegt in der Zwischenablage, jetzt pasten'.
# freedesktop-Soundname (z.B. "complete", "bell"); '' = aus.
done_sound = ""
done_sound_volume = 35000        # paplay-Promille (0..65536)