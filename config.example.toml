# STT-Button configuration
# Copy to ~/.config/stt-button/config.toml and adjust.

# --- Trigger ---------------------------------------------------------
# The device the Copilot key appears on.
# On ThinkPads with keyd: "keyd virtual keyboard" (key -> F24)
input_device_name = "keyd virtual keyboard"
# The Linux key codes that trigger push-to-talk.
key_codes = ["KEY_F24"]

# --- Audio -------------------------------------------------------------
# PipeWire source name (from: pactl list short sources) or "auto".
# The default source "deepfilter_source" (noise suppression) is silent on
# this ThinkPad when the digital microphone is muted.
# Hence the explicit SOF source here. "auto" picks deepfilter_source.
audio_source = "alsa_input.pci-0000_00_1f.3-platform-sof_sdw.HiFi__hw_sofsoundwire_10__source"

# --- ASR ---------------------------------------------------------------
backend = "parakeet"           # "parakeet" (NVIDIA TDT, fast) or "whisper"
model = "nvidia/parakeet-tdt-0.6b-v3"   # for backend=whisper: "large-v3-turbo"
language = "auto"             # Parakeet detects DE/EN automatically
compute_type = "float32"     # parakeet: float32 (CPU); whisper: int8
cpu_threads = 8

# --- Output -----------------------------------------------------------
typer = "dotool"               # "dotool" (GNOME/Wayland), "wtype", "clipboard"
xkb_layout = "de"               # keyboard layout for dotool
xkb_variant = "nodeadkeys"      # without dead keys (for accents)
typedelay_ms = 20              # typing speed; raise on modifier hangs (e.g. 30)
typehold_ms = 15               # key hold time
capslock_autocorrect = false   # app must NEVER toggle CapsLock unasked (warn only); true = force target state before typing
capslock_led_inverted = true    # LED semantics of this system (established): true = LED off means CapsLock active; target with autocorrect = LED on
append_space = true            # space after the dictation
max_revision_chars = 60
final_paste = false           # true = final delta pasted via clipboard on finalize instead of typed (throughput)
paste_key = "ctrl+v"          # insert chord; "ctrl+shift+v" for terminals
paste_binary = "wl-copy"      # binary for the copy step (wl-clipboard)

# --- Streaming ---------------------------------------------------------
streaming_mode = "whole_buffer"
min_audio_s = 3.0              # only transcribe once 3s of audio are in
asr_interval_s = 1.0           # re-transcribe every X seconds of audio
asr_interval_adaptive_k = 0.0  # >0: live interval = k x last tick (2.0 = TalkType)
asr_interval_max_s = 6.0       # upper bound of the adaptive interval
max_record_s = 300.0
commit_agreements = 2          # prefix confirmations before commit
sample_rate = 16000

# --- Latency (STAGE 1) ------------------------------------------------------
# finalize_mode: "full" = finalization re-transcribes the whole buffer
# (previous behavior); "cached" = the unchanged audio since the last
# successful live tick is carried over without an engine call (saves a
# complete inference pass for short dictations; only sensible with
# deterministic engines like Parakeet).
finalize_mode = "full"
# audio_dump_mode: "sync" = WAV debug dump in the finalizer (previous),
# "async" = dump in its own thread (file I/O not on the critical path),
# "off" = no dump. Target stays /tmp/stt_last.wav.
audio_dump_mode = "sync"
# latency_trace: true logs debug timings at the release -> output
# measurement points (stop entered / source stopped / dump / finalize
# start / finalize end / paste).
latency_trace = false

# --- Live preview modes (STAGE 2/3) ----------------------------------------
# live_typing_mode: "committed" (default) types only the secured prefix
# increment - the unstable partial is never re-typed, the final suffix
# arrives on release as ONE paste (zero backspaces).
# "full" (opt-in) types unstable partials live and corrects them via
# backspace (previous behavior, lively preview).
live_typing_mode = "committed"
# live_asr_until_s: stop live ticks after this buffer length (seconds) -
# the whole-buffer approach gets more expensive per tick. feed() keeps
# collecting, finalize() transcribes the complete buffer.
# Default 15.0: with the int8 engine (RTF ~0.05) a 15s whole-buffer tick
# costs ~0.75s < asr_interval_s (1.0s) - live preview up to 15s is viable.
# 0.0 = live ticks always active (previous behavior, opt-in).
live_asr_until_s = 15.0
# Phase 2 (C): sentence-pause segmentation (opt-in). A VAD pause after a
# hypothesis ending in .?! closes the segment; live_asr_until_s then
# applies per segment. Requires streaming_mode="whole_buffer", excludes
# finalize_mode="cached_mid_tail", needs 0 < segment_max_s <= live_asr_until_s.
# Recommended when enabling: 1.2 / 3.0 / 15.0.
segment_pause_s = 0.0
segment_min_s = 3.0
segment_max_s = 0.0

# Done signal (operator, 31.10.): quiet tone after a SUCCESSFUL
# finalization = 'text is in the clipboard, paste now'.
# freedesktop sound name (e.g. "complete", "bell"); '' = off.
done_sound = ""
done_sound_volume = 65536        # paplay permille (0..65536); 65536 = desktop level (35000 was inaudible at 24% sink)

# When the done signal sounds: "terminal" = only when a terminal is
# focused (requires the GNOME Shell extension stt-button-focus; without
# the extension the tone still plays - feedback over silence),
# "always" (default) = on every dictation.
done_sound_mode = "always"
max_queue_depth = 4              # max recordings waiting for finalization
